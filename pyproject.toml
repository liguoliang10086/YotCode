[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "yotcode"
version = "0.1.0"
description = "YotCode - a Python recreation of Claude Code, a terminal AI coding agent"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "YotCode" }]
dependencies = [
    "textual>=8.0,<9",
    "rich>=13.7",
    "httpx>=0.27",
    # 剪贴板截图（Ctrl+Shift+V）需要 Pillow 读取系统剪贴板；作为必需依赖，
    # pip install 后即可开箱即用，无需用户额外安装。
    "Pillow>=10",
]

[project.scripts]
# 主命令
yot = "yotcode.cli:main"
yotcode = "yotcode.cli:main"


[project.optional-dependencies]
dev = ["pytest>=8", "pytest-asyncio>=0.23"]

[tool.setuptools.packages.find]
include = ["yotcode*"]

[tool.setuptools.package-data]
yotcode = ["ui/*.tcss"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
addopts = "-q"
